<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · YankaDevLab</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#171717;--muted:#737373;--line:#e5e5e5;--accent:#171717;--accent-ink:#fff;--danger:#dc2626;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#171717;--ink:#fafafa;--muted:#a3a3a3;--line:#262626;--accent:#fafafa;--accent-ink:#171717;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{margin:0;font-size:1.5rem;text-align:center}
p{margin:4px 0 20px;text-align:center;color:var(--muted);font-size:.875rem}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.875rem;font-weight:500}
input{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.error{margin:0;color:var(--danger);font-size:.875rem;text-align:left}
</style>
</head>
<body>
<main>
  <h1>YankaDevLab</h1>
  <p>Sign in to continue</p>
  <form method="post" action="/login">
    <input type="hidden" name="rd" value="{{.Redirect}}">
    <label>Email<input type="email" name="email" value="{{.Email}}" autocomplete="email" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
