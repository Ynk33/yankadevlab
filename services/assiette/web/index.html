<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assiette</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EEF2EA;--card:#FFFFFF;--ink:#17241C;--muted:#5B6B60;--line:#D3DCD0;--soft:#E3EADF;
  --accent:#1E4D36;--accent-ink:#FFFFFF;--danger:#8E2A4A;--fav:#C2304F;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1612;--card:#18211B;--ink:#E4ECE6;--muted:#9AAA9F;--line:#2A372F;--soft:#1E2922;--accent:#86C9A0;--accent-ink:#0E1F15;--danger:#E58AA6;--fav:#F07A93}}
:root[data-theme="dark"]{--bg:#0F1612;--card:#18211B;--ink:#E4ECE6;--muted:#9AAA9F;--line:#2A372F;--soft:#1E2922;--accent:#86C9A0;--accent-ink:#0E1F15;--danger:#E58AA6;--fav:#F07A93}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
h1{font-size:2.1rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
.muted{color:var(--muted)}.small{font-size:.875rem}
.logo{display:block;border-radius:16px;margin-bottom:12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top p{margin:2px 0 0}
.btn{border:0;border-radius:999px;padding:10px 17px;font-weight:600;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid currentColor}
.btn.sm{padding:7px 13px;font-size:.875rem}
.btn.on{background:var(--soft);color:var(--ink);border:1px solid var(--accent)}
.btn.icon{padding:8px;display:inline-flex;align-items:center;justify-content:center;line-height:0}
.btn.icon.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn.icon.spin svg{animation:none}}
.top-actions{display:flex;gap:8px;align-items:center}

/* filters */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);margin-bottom:14px}

/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.card .open{all:unset;cursor:pointer;display:block}
.card .open:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.card .t{font-weight:600;line-height:1.3;display:block}
.card .m{font-size:.85rem;color:var(--muted);display:block;margin-top:2px}
.card .h{font-size:.82rem;color:var(--muted);display:block;margin-top:4px}
.heart{color:var(--fav)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.x{background:transparent;border:1px solid var(--line)}
.more{display:flex;justify-content:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}

/* mine */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.stepper button{border:0;background:none;width:34px;height:32px;font-size:1.1rem;line-height:1}
.stepper span{min-width:56px;text-align:center;font-size:.875rem;font-variant-numeric:tabular-nums}
.mine-actions{display:flex;gap:8px;align-items:center;grid-column:1 / -1;flex-wrap:wrap}
.mine-actions .btn{margin-left:auto}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center}
.empty p{margin:6px 0 14px}

/* shopping */
.aisle{margin-bottom:18px}
.aisle h3{margin-bottom:6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.item .q{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .n,.item.done .q{text-decoration:line-through;opacity:.55}
details.basket{margin-top:20px}
details.basket summary{cursor:pointer;color:var(--muted);margin-bottom:8px}
form.extra{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
form.extra input,form.extra select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
form.extra input{flex:3 1 220px;min-width:0}
form.extra .pick{display:flex;gap:8px;flex:1 0 auto;align-items:center}
form.extra select{flex:1}
.item .rm{margin-left:auto;background:none;border:0;color:var(--muted);padding:0 4px;font-size:1.1rem;line-height:1}

/* plus */
.section{margin-top:28px}
.section h2{margin-bottom:4px}
.section > p{margin:0 0 12px}
.ban{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
form.prefs{display:grid;gap:14px}
label.f{display:grid;gap:5px;font-weight:600;font-size:.95rem}
label.f span{font-weight:400;color:var(--muted);font-size:.85rem}
.f input,.f textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:400}
.f textarea{min-height:64px;resize:vertical}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:12px 4px 14px;font-size:.9rem;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
nav.tabs b{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;line-height:18px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,18,13,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;z-index:21;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:720px){.sheet{top:0;bottom:0;margin:auto;height:fit-content;max-height:calc(100% - 64px);border-radius:18px;padding-bottom:24px}}
.sheet .close{display:flex;justify-content:flex-end}
.sheet .close button{background:none;border:0;color:var(--muted);padding:6px}
.sheet h2{margin:2px 0 6px}
.nutri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.nutri div{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.nutri b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem}
.nutri span{font-size:.8rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;padding:0;list-style:none}
.chips li{background:var(--soft);border-radius:999px;padding:4px 11px;font-size:.85rem}
.sheet h3{margin:20px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ings{list-style:none;padding:0;margin:0}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.ings li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{padding-left:22px;margin:0}
.steps li{margin-bottom:9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.fav-on{color:var(--fav)!important;border-color:var(--fav)!important}
.status{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:.92rem}
.status.err{border-color:var(--danger);color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:90vw;display:flex;gap:12px;align-items:center}
.toast:empty{display:none}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;padding:0}
</style>
</head>

erything on top and sprinkle with sesame."]],"maquereau-au-four-patate-douce-et-brocoli":["Baked mackerel, sweet potato and broccoli",["Omega-3","Vitamin D","Beta-carotene"],["Cube the sweet potato, toss with oil and paprika, roast for 15 min at 200 °C.","Add the broccoli florets and mackerel fillets to the tray.","Roast 12 more min, squeeze lemon over before serving."]],"rillettes-de-sardines-tartines-et-crudites":["Sardine rillettes, toast and crudités",["Omega-3","Calcium","Vitamin D"],["Mash the drained sardines with the fromage blanc, lemon juice and chopped chives.","Season with pepper to taste.","Spread on toasted wholemeal bread, serve with radishes and carrot sticks."]],"cabillaud-vapeur-sauce-yaourt-aneth-et-quinoa":["Steamed cod, dill yogurt sauce and quinoa",["Lean protein","Iodine","Magnesium"],["Cook the quinoa for 12 min in twice its volume of water.","Steam the cod and sliced courgettes for 10 min.","Mix the yogurt, chopped dill, lemon zest and juice.","Serve the fish on the quinoa with the sauce and a drizzle of oil."]],"curry-de-colin-au-lait-de-coco-et-epinards":["Pollock curry with coconut milk and spinach",["Iodine","Iron","Antioxidants"],["Start cooking the rice.","Sauté onion, garlic and ginger, add the curry powder for 1 min.","Add tomatoes and coconut milk, simmer for 10 min.","Add the pollock in chunks and the spinach, cover and cook 6 min. Serve with rice and coriander."]],"salade-nicoise-au-thon":["Tuna niçoise salad",["Omega-3","Vitamin B12","Fibre"],["Boil the potatoes for 20 min and the green beans for 8 min in salted water.","Boil the eggs for 9 min and peel them.","Whisk a dressing with oil, vinegar, salt and pepper.","Assemble lettuce, vegetables, flaked tuna, egg quarters and olives."]],"truite-en-papillote-fenouil-et-orange":["Trout en papillote with fennel and orange",["Omega-3","Vitamin C","Potassium"],["Start cooking the rice.","Thinly slice the fennel and divide it between two sheets of baking paper.","Add the trout, orange slices, thyme and oil, seal the parcels.","Bake for 18 min at 200 °C, serve with the rice."]],"tacos-de-cabillaud-chou-rouge-et-sauce-yaourt":["Cod tacos with red cabbage and yogurt sauce",["Iodine","Vitamin C","Fibre"],["Shred the red cabbage and toss with half the lime juice and a pinch of salt.","Season the cod with paprika, pan-fry 3 min per side, then flake it.","Mix the yogurt with the remaining lime juice.","Fill the warm tortillas with fish, cabbage, avocado, sauce and coriander."]],"salade-de-maquereau-pommes-de-terre-et-betterave":["Mackerel, potato and beetroot salad",["Omega-3","Folate","Vitamin D"],["Boil the potatoes for 20 min, slice them while warm.","Dice the beetroot and slice the red onion.","Whisk mustard, vinegar and oil.","Toss with the lamb's lettuce and flaked mackerel."]],"saumon-teriyaki-brocoli-et-riz-complet":["Teriyaki salmon, broccoli and brown rice",["Omega-3","Vitamin C","Selenium"],["Cook the rice and steam the broccoli.","Mix soy sauce, honey, grated ginger and garlic.","Pan-fry the salmon 3 min per side, pour in the sauce and let it caramelise for 2 min.","Serve with the rice, broccoli and sesame seeds."]],"pates-completes-aux-sardines-citron-et-persil":["Wholewheat pasta with sardines, lemon and parsley",["Omega-3","Calcium","Vitamin D"],["Cook the pasta al dente.","Sauté the garlic and halved cherry tomatoes for 4 min.","Add the sardines in pieces, the lemon zest and juice.","Toss with the pasta, parsley and chilli."]],"colin-pane-aux-flocons-d-avoine-puree-de-petits-pois":["Oat-crusted pollock with pea purée",["Protein","Fibre","Vitamin B1"],["Cook the peas for 8 min, blend with the mint, a drizzle of oil, salt and pepper.","Dip the pollock in beaten egg, then in coarsely blitzed oats.","Bake for 15 min at 200 °C on an oiled tray.","Serve with the purée and a lemon wedge."]],"taboule-de-quinoa-a-la-truite-fumee":["Quinoa tabbouleh with smoked trout",["Omega-3","Magnesium","Vitamin C"],["Cook the quinoa and let it cool.","Finely dice cucumber and tomatoes, chop the herbs.","Mix with lemon juice, oil, salt and pepper.","Add the smoked trout in strips."]],"gratin-de-cabillaud-poireaux-et-pommes-de-terre":["Cod, leek and potato gratin",["Iodine","Vitamin K","Potassium"],["Boil the sliced potatoes for 10 min.","Soften the sliced leeks in a pan for 10 min.","Layer potatoes, leeks and cod chunks in a dish, top with cream and thyme.","Sprinkle with grated Comté, bake for 20 min at 200 °C."]],"galettes-de-sarrasin-au-saumon-fume-et-epinards":["Buckwheat galettes with smoked salmon and spinach",["Omega-3","Iron","Magnesium"],["Wilt the spinach in a pan for 2 min.","Warm the galettes, fill with ricotta, spinach and salmon.","Add dill and a squeeze of lemon, fold and serve."]],"pave-de-saumon-puree-de-chou-fleur-et-haricots-verts":["Salmon fillet, cauliflower purée and green beans",["Omega-3","Vitamin C","Folate"],["Cook the cauliflower florets for 15 min, blend with the milk, nutmeg, salt and pepper.","Boil the green beans for 8 min.","Pan-fry the salmon 4 min skin side down, then 2 min on the other side.","Serve with the purée and the beans drizzled with oil."]],"buddha-bowl-thon-pois-chiches-et-crudites":["Tuna, chickpea and crunchy veg Buddha bowl",["Protein","Fibre","Vitamin B12"],["Rinse the chickpeas, grate the carrot, chop the cucumber and tomatoes.","Thin the tahini with lemon juice and a little water.","Arrange rocket, vegetables, chickpeas and tuna, drizzle with the sauce."]],"maquereau-poele-sarrasin-et-chou-kale":["Pan-fried mackerel, buckwheat and kale",["Omega-3","Magnesium","Vitamin K"],["Boil the buckwheat for 12 min, drain.","Sauté onion and garlic, add the shredded kale for 4 min.","Pan-fry the mackerel 3 min skin side down, 1 min on the other.","Toss buckwheat and kale with lemon, serve with the fish."]],"cabillaud-a-la-provencale-et-boulgour":["Provençal cod with bulgur",["Iodine","Lycopene","Fibre"],["Cook the bulgur.","Sauté onion and garlic, add tomatoes, herbs, olives and capers, simmer 10 min.","Nestle the cod in the sauce, cover and cook 8 min.","Serve with the bulgur and basil."]],"wrap-au-saumon-fume-avocat-et-crudites":["Smoked salmon, avocado and veg wrap",["Omega-3","Healthy fats","Fibre"],["Mash the avocado with the lemon juice.","Spread the tortillas with fromage blanc and avocado.","Fill with salmon, cucumber ribbons and rocket, roll tightly."]],"truite-aux-amandes-haricots-verts-et-pommes-de-terre":["Trout amandine, green beans and potatoes",["Omega-3","Vitamin E","Magnesium"],["Boil the potatoes for 20 min and the beans for 8 min.","Pan-fry the trout 3 min per side in the oil.","Toast the flaked almonds in a dry pan for 2 min.","Serve with the vegetables, almonds, parsley and lemon."]],"soupe-thai-aux-crevettes-et-nouilles-de-riz":["Thai prawn soup with rice noodles",["Iodine","Selenium","Vitamin C"],["Bring 700 ml water to the boil with the stock, ginger and coconut milk.","Add the sliced mushrooms and pak choi, cook 4 min.","Add prawns and noodles, cook 3 min.","Finish with lime and coriander."]],"moules-marinieres-frites-de-patate-douce-au-four":["Moules marinières with baked sweet potato fries",["Iron","Iodine","Vitamin B12"],["Cut the sweet potato into fries, toss in oil and bake 30 min at 210 °C.","Sweat shallots and garlic in a large pot.","Add the cleaned mussels and 100 ml water, cover for 6 min, shaking the pot.","Sprinkle with parsley, serve with the fries."]],"wok-de-crevettes-brocoli-et-nouilles-soba":["Prawn, broccoli and soba stir-fry",["Iodine","Vitamin C","Magnesium"],["Cook the soba for 4 min, rinse in cold water.","Stir-fry broccoli and pepper for 4 min over high heat.","Add prawns, garlic and ginger for 3 min.","Add noodles and soy sauce, toss for 1 min."]],"salade-de-crevettes-mangue-avocat-et-quinoa":["Prawn, mango, avocado and quinoa salad",["Vitamin C","Healthy fats","Iodine"],["Cook the quinoa and let it cool.","Dice mango, avocado and cucumber.","Toss with prawns, quinoa, lime, oil and coriander."]],"orgeotto-aux-crevettes-et-petits-pois":["Pearl barley risotto with prawns and peas",["Fibre","Iodine","Zinc"],["Sauté the shallot, add the barley for 1 min.","Gradually add 800 ml hot stock, cook 30 min, stirring.","Add peas and prawns for the last 5 minutes.","Finish with Parmesan, lemon zest and juice."]],"curry-de-crevettes-et-patate-douce":["Prawn and sweet potato curry",["Beta-carotene","Iodine","Selenium"],["Start cooking the rice.","Sauté the onion, add curry powder and diced sweet potato.","Pour in coconut milk and tomatoes, simmer 15 min.","Add prawns and spinach, cook 4 min."]],"dahl-de-lentilles-corail-coco-et-epinards":["Red lentil dal with coconut and spinach",["Iron","Folate","Fibre"],["Start cooking the rice.","Sauté onion, garlic, ginger and spices.","Add lentils, tomatoes, coconut milk and 300 ml water, simmer 20 min.","Stir in the spinach at the end."]],"chili-sin-carne-aux-haricots-rouges":["Red bean chilli sin carne",["Fibre","Iron","Antioxidants"],["Start cooking the rice.","Sauté onion, garlic and diced pepper, add the spices.","Add tomatoes, rinsed beans and sweetcorn, simmer 25 min.","Serve with the rice and a spoonful of yogurt."]],"falafels-au-four-sauce-tahini-et-salade":["Baked falafel with tahini sauce and salad",["Fibre","Magnesium","Calcium"],["Blend chickpeas, onion, garlic, parsley, cumin and flour.","Shape into balls, brush with oil, bake 25 min at 200 °C, turning once.","Thin the tahini with lemon and a little water.","Serve on the lettuce and tomatoes with the sauce."]],"salade-de-lentilles-betterave-et-feta":["Lentil, beetroot and feta salad",["Iron","Folate","Calcium"],["Cook the lentils for 20 min, drain and let cool slightly.","Dice the beetroot, slice the onion.","Toss with the dressing, add lamb's lettuce, crumbled feta and walnuts."]],"bowl-houmous-legumes-rotis-et-quinoa":["Hummus bowl with roasted veg and quinoa",["Fibre","Magnesium","Vitamin A"],["Roast courgette, pepper and onion chunks for 25 min at 200 °C with 1 tbsp oil.","Cook the quinoa.","Blend chickpeas, tahini, lemon, garlic, 1 tbsp oil and a little water.","Assemble quinoa, vegetables and hummus, sprinkle with seeds."]],"curry-de-pois-chiches-et-epinards":["Chickpea and spinach curry",["Iron","Fibre","Vitamin K"],["Start cooking the rice.","Sauté onion, garlic and garam masala.","Add tomatoes, chickpeas and coconut milk, simmer 15 min.","Stir in the spinach 2 min before serving."]],"minestrone-aux-haricots-blancs":["White bean minestrone",["Fibre","Vitamin C","Potassium"],["Sauté diced onion, carrot and celery for 5 min.","Add tomatoes, stock and 800 ml water, cook 15 min.","Add courgette, beans and pasta, cook 10 min.","Serve with Parmesan and basil."]],"burger-de-haricots-noirs-frites-de-patate-douce":["Black bean burger with sweet potato fries",["Fibre","Iron","Beta-carotene"],["Cut the sweet potato into fries, oil them and bake 30 min at 210 °C.","Mash beans, oats, chopped onion and cumin, shape 2 patties.","Pan-fry the patties 4 min per side.","Build the burgers with tomato, lettuce and yogurt."]],"tacos-de-haricots-noirs-mais-et-avocat":["Black bean, sweetcorn and avocado tacos",["Fibre","Healthy fats","Vitamin C"],["Warm beans and sweetcorn with cumin for 5 min, lightly mash.","Make a guacamole with avocado, lime and salt.","Dice tomato and onion.","Fill the warm tortillas and sprinkle with coriander."]],"salade-de-pois-chiches-concombre-et-menthe":["Chickpea, cucumber and mint salad",["Fibre","Vitamin C","Magnesium"],["Rinse the chickpeas.","Dice cucumber, tomatoes and onion, chop the herbs.","Dress with lemon, oil, salt and pepper, add the feta."]],"lentilles-mijotees-aux-carottes-et-uf-mollet":["Braised lentils with carrots and soft-boiled egg",["Iron","Protein","Vitamin A"],["Sauté onion and sliced carrots.","Add lentils, garlic, thyme and 600 ml water, cook 25 min.","Boil the eggs for 6 min, peel them.","Stir the mustard into the lentils, serve with the egg and parsley."]],"bolognaise-de-lentilles-corail-pates-completes":["Red lentil bolognese with wholewheat pasta",["Fibre","Iron","Lycopene"],["Sauté onion, grated carrot and garlic.","Add lentils, passata, herbs and 200 ml water, simmer 20 min.","Cook the pasta.","Serve the sauce over the pasta with Parmesan."]],"tajine-de-pois-chiches-carottes-et-raisins":["Chickpea, carrot and raisin tagine",["Fibre","Beta-carotene","Iron"],["Sauté onion and spices.","Add carrots, courgette, tomatoes and 200 ml water, simmer 20 min.","Add chickpeas and raisins, cook 10 min.","Serve on the couscous with almonds and coriander."]],"soupe-de-lentilles-corail-carotte-et-cumin":["Red lentil, carrot and cumin soup",["Iron","Beta-carotene","Fibre"],["Sauté onion and cumin.","Add carrots, lentils, stock and 800 ml water, cook 20 min.","Blend, add the lemon juice.","Serve with yogurt and toasted bread."]],"bowl-haricots-rouges-riz-complet-et-avocat":["Red bean, brown rice and avocado bowl",["Fibre","Healthy fats","Potassium"],["Cook the rice.","Warm the beans with the paprika.","Shred the cabbage, chop tomatoes and avocado.","Assemble and squeeze lime over."]],"salade-de-haricots-blancs-roquette-et-parmesan":["White bean, rocket and Parmesan salad",["Fibre","Calcium","Vitamin K"],["Rinse the beans.","Halve the tomatoes, slice the onion.","Toss with rocket, dressing and basil, add Parmesan shavings."]],"galettes-de-lentilles-yaourt-a-la-menthe":["Lentil patties with mint yogurt",["Iron","Protein","Fibre"],["Cook the lentils for 20 min, drain.","Mash with egg, oats, chopped onion and cumin, shape 6 patties.","Pan-fry 3 min per side.","Serve with the mint and cucumber yogurt and the salad."]],"mujaddara-lentilles-riz-et-oignons-caramelises":["Mujaddara: lentils, rice and caramelised onions",["Iron","Fibre","Magnesium"],["Cook lentils and rice together for 30 min in 700 ml water with the cumin.","Slowly caramelise the sliced onions in the oil for 20 min.","Stir half the onions into the lentils, top with the rest.","Serve with yogurt and cucumber."]],"soupe-de-pois-casses-et-legumes":["Split pea and vegetable soup",["Fibre","Protein","Potassium"],["Sauté onion and leek.","Add split peas, carrots, stock and 1 L water, cook 40 min.","Blend and adjust the thickness.","Serve with chives and toasted bread."]],"salade-tiede-de-lentilles-chevre-et-noix":["Warm lentil salad with goat's cheese and walnuts",["Iron","Omega-3","Calcium"],["Cook the lentils for 20 min.","Make a dressing with mustard, vinegar, oil and chopped shallot.","Toss warm lentils, diced apple and lamb's lettuce.","Top with goat's cheese and walnuts."]],"curry-de-haricots-rouges-et-butternut":["Red bean and butternut curry",["Beta-carotene","Fibre","Iron"],["Start cooking the rice.","Sauté onion, ginger and curry powder.","Add diced butternut, coconut milk and 150 ml water, cook 20 min.","Add the beans for 5 min, serve with rice and coriander."]],"wraps-houmous-crudites-et-graines":["Hummus, crudités and seed wraps",["Fibre","Vitamin A","Magnesium"],["Grate the carrot, shred the cabbage, cut the cucumber into sticks.","Spread the tortillas with hummus.","Fill with vegetables, spinach and seeds, roll tightly."]],"ragout-de-haricots-blancs-kale-et-tomate":["White bean, kale and tomato stew",["Fibre","Vitamin K","Calcium"],["Sauté onion, garlic and rosemary.","Add tomatoes and beans, simmer 15 min.","Add the shredded kale for 5 min.","Serve with Parmesan and toasted bread."]],"bowl-edamame-quinoa-et-sauce-miso":["Edamame and quinoa bowl with miso dressing",["Protein","Magnesium","Folate"],["Cook the quinoa, thaw the edamame in hot water.","Thin miso with lime, oil and 2 tbsp water.","Grate carrot and cabbage, slice the avocado.","Assemble, drizzle with dressing, sprinkle with sesame."]],"chili-de-lentilles-et-patate-douce":["Lentil and sweet potato chilli",["Fibre","Beta-carotene","Iron"],["Sauté onion and pepper, add the spices.","Add lentils, diced sweet potato, tomatoes and 400 ml water.","Simmer 30 min.","Serve with yogurt and coriander."]],"pates-completes-pois-chiches-et-brocoli-au-citron":["Wholewheat pasta with chickpeas, broccoli and lemon",["Fibre","Vitamin C","Magnesium"],["Cook the pasta, adding the broccoli for the last 4 minutes.","Brown garlic and chickpeas in the oil for 5 min.","Toss with pasta and broccoli, lemon zest and juice.","Serve with Parmesan and chilli."]],"salade-de-pois-chiches-rotis-kale-et-grenade":["Roasted chickpea, kale and pomegranate salad",["Fibre","Vitamin C","Antioxidants"],["Roast the chickpeas with oil and paprika for 25 min at 200 °C.","Cook the quinoa.","Massage the shredded kale with lemon juice.","Toss together, add pomegranate and thinned tahini."]],"veloute-de-potimarron-et-lentilles-corail":["Red kuri squash and red lentil soup",["Beta-carotene","Iron","Fibre"],["Cube the squash, skin on.","Sauté the onion, add squash, lentils, stock and 800 ml water.","Cook 25 min, blend with the coconut milk.","Serve with pumpkin seeds and bread."]],"poulet-roti-au-citron-legumes-du-soleil-et-boulgour":["Lemon roast chicken, Mediterranean veg and bulgur",["Protein","Vitamin C","Fibre"],["Chop the vegetables, toss with oil and herbs.","Add the chicken in large pieces and the lemon in wedges.","Roast 30 min at 200 °C.","Serve with the bulgur."]],"bowl-poulet-quinoa-avocat-et-mais":["Chicken, quinoa, avocado and sweetcorn bowl",["Protein","Healthy fats","Magnesium"],["Cook the quinoa.","Pan-fry the paprika-seasoned chicken 6 min per side, slice it.","Chop avocado and tomatoes.","Assemble, drizzle with lime and oil."]],"curry-de-poulet-epinards-et-riz-complet":["Chicken and spinach curry with brown rice",["Protein","Iron","Vitamin K"],["Start cooking the rice.","Brown the diced chicken, set aside.","Sauté onion, garlic, ginger and curry, add tomatoes and coconut milk.","Return the chicken for 12 min, add the spinach at the end."]],"poulet-tikka-au-yaourt-chou-fleur-roti":["Yogurt chicken tikka with roasted cauliflower",["Protein","Vitamin C","Calcium"],["Marinate the chicken pieces in yogurt, garlic and spices for 15 min.","Roast the oiled cauliflower florets for 25 min at 210 °C.","Add the chicken to the tray halfway through.","Serve with lemon and coriander."]],"salade-cesar-legere-au-poulet":["Light chicken Caesar salad",["Protein","Calcium","Vitamin A"],["Pan-fry the chicken 6 min per side, slice it.","Toast the bread into croutons.","Mix yogurt, mustard, lemon, grated garlic and half the Parmesan.","Assemble lettuce, tomatoes, chicken, croutons, dressing and Parmesan shavings."]],"wok-de-dinde-legumes-croquants-et-soba":["Turkey, crunchy veg and soba stir-fry",["Protein","Vitamin C","Magnesium"],["Cook the soba for 4 min, rinse.","Stir-fry the turkey strips for 4 min over high heat.","Add the sliced vegetables and ginger for 4 min.","Add noodles and soy sauce, toss."]],"fajitas-de-poulet-aux-poivrons":["Chicken and pepper fajitas",["Protein","Vitamin C","Fibre"],["Slice chicken, peppers and onion.","Sear the chicken with the spices for 5 min, add the vegetables for 6 min.","Mash the avocado with lime.","Fill the tortillas with chicken, guacamole and yogurt."]],"poulet-basquaise-et-riz-complet":["Basque chicken with brown rice",["Protein","Vitamin C","Lycopene"],["Brown the thighs in oil, set aside.","Sauté onion, garlic and pepper strips.","Add tomatoes, chilli and chicken, cover and simmer 30 min.","Serve with the rice."]],"brochettes-de-dinde-et-taboule-de-boulgour":["Turkey skewers with bulgur tabbouleh",["Protein","Vitamin C","Fibre"],["Cook the bulgur, let it cool.","Mix with diced tomatoes and cucumber, herbs, lemon and oil.","Thread the turkey cubes onto skewers, season with paprika.","Grill 10 min, turning, serve with the tabbouleh."]],"soupe-de-poulet-legumes-et-orge":["Chicken, vegetable and barley soup",["Protein","Fibre","Vitamin A"],["Sauté diced leek, carrot and celery.","Add barley, stock, thyme and 1 L water, cook 25 min.","Add the diced chicken, cook 10 min.","Serve with parsley."]],"poulet-miel-moutarde-haricots-verts-et-patate-douce":["Honey-mustard chicken, green beans and sweet potato",["Protein","Beta-carotene","Vitamin K"],["Roast the cubed sweet potato with oil and thyme for 25 min at 200 °C.","Mix mustard and honey, brush over the chicken.","Bake the chicken for 18 min.","Boil the beans for 8 min, serve together."]],"wraps-de-poulet-crudites-et-houmous":["Chicken, crudités and hummus wraps",["Protein","Fibre","Vitamin A"],["Pan-fry the paprika-seasoned chicken, slice it.","Grate the carrot, slice the tomato.","Spread the tortillas with hummus, fill and roll."]],"tajine-de-poulet-carottes-et-pois-chiches":["Chicken tagine with carrots and chickpeas",["Protein","Fibre","Beta-carotene"],["Brown the chicken, add onion and spices.","Add carrots, lemon wedges and 300 ml water, simmer 30 min.","Add chickpeas and olives for 10 min.","Serve with couscous and coriander."]],"escalope-de-dinde-poelee-de-courgettes-et-quinoa":["Turkey escalope, sautéed courgettes and quinoa",["Protein","Magnesium","Vitamin C"],["Cook the quinoa.","Sauté the diced courgettes with garlic for 8 min.","Cook the escalopes 3 min per side.","Serve with lemon and Parmesan over the courgettes."]],"salade-de-poulet-mangue-chou-chinois-et-cajou":["Chicken, mango, Chinese cabbage and cashew salad",["Protein","Vitamin C","Magnesium"],["Pan-cook the chicken, shred it.","Shred the cabbage, grate the carrot, dice the mango.","Mix lime, soy sauce and oil.","Assemble and sprinkle with cashews and coriander."]],"poulet-satay-brocoli-et-riz-complet":["Chicken satay, broccoli and brown rice",["Protein","Vitamin C","Magnesium"],["Cook the rice and broccoli.","Brown the chicken strips for 6 min.","Add peanut butter, coconut milk, soy sauce and lime, simmer 3 min.","Serve with rice and broccoli."]],"cuisses-de-poulet-potimarron-et-kale-rotis":["Roast chicken thighs, red kuri squash and kale",["Beta-carotene","Vitamin K","Protein"],["Cut the squash into wedges and the onion into petals.","Arrange with the chicken on a tray, drizzle with oil and rosemary.","Roast 40 min at 200 °C.","Add the oiled kale for the last 8 minutes."]],"poulet-au-paprika-poivrons-et-pois-chiches":["Paprika chicken with peppers and chickpeas",["Protein","Vitamin C","Fibre"],["Brown the chicken pieces with the paprika.","Add onion and pepper strips for 5 min.","Add tomatoes and chickpeas, simmer 20 min.","Serve with a spoonful of yogurt."]],"pates-completes-au-poulet-brocoli-et-pesto":["Wholewheat pasta with chicken, broccoli and pesto",["Protein","Vitamin C","Fibre"],["Cook the pasta, adding the broccoli for the last 4 minutes.","Pan-fry the diced chicken for 6 min.","Toss pasta, broccoli, chicken, pesto and tomatoes.","Serve with Parmesan."]],"dinde-aux-champignons-epinards-et-sarrasin":["Turkey with mushrooms, spinach and buckwheat",["Protein","Iron","Magnesium"],["Boil the buckwheat for 12 min.","Brown the turkey strips, set aside.","Sauté shallot and mushrooms, add spinach and thyme.","Return the turkey with the cream for 3 min, serve over the buckwheat."]],"b-uf-saute-brocoli-et-nouilles-soba":["Beef stir-fry with broccoli and soba",["Iron","Zinc","Vitamin C"],["Cook the soba for 4 min, rinse.","Sear the thin beef strips for 2 min, set aside.","Stir-fry the broccoli with garlic and ginger for 4 min.","Return beef and noodles with the soy sauce, sprinkle with sesame."]],"boulettes-de-b-uf-sauce-tomate-et-pates-completes":["Beef meatballs, tomato sauce and wholewheat pasta",["Iron","Zinc","Lycopene"],["Mix beef, egg, oats and half the chopped onion, shape into meatballs.","Brown them in a pan.","Add the remaining onion and the passata, simmer 15 min.","Serve over the pasta with Parmesan and basil."]],"chili-con-carne-aux-haricots-rouges":["Chilli con carne with red beans",["Iron","Fibre","Zinc"],["Brown the beef, add onion, garlic and pepper.","Add spices, tomatoes and beans.","Simmer 30 min.","Serve with the rice."]],"steak-patate-douce-rotie-et-roquette":["Steak, roasted sweet potato and rocket",["Iron","Zinc","Beta-carotene"],["Roast the sweet potato wedges with oil and rosemary for 25 min at 210 °C.","Sear the steaks to your liking, rest for 3 min.","Dress rocket and tomatoes with balsamic, oil and Parmesan.","Serve together."]],"parmentier-b-uf-lentilles-a-la-patate-douce":["Beef and lentil cottage pie with sweet potato",["Iron","Fibre","Beta-carotene"],["Boil the sweet potato chunks for 15 min, mash.","Cook the lentils for 20 min.","Sauté onion and carrot, add beef, tomatoes, thyme and lentils for 10 min.","Top with the mash and Comté, bake 20 min at 200 °C."]],"b-uf-mijote-aux-carottes":["Braised beef with carrots",["Iron","Zinc","Vitamin A"],["Brown the beef cubes in a casserole.","Add onions, garlic, tomato paste, then stock, herbs and water to cover.","Simmer covered for 1 h 30.","Add carrots and potatoes, cook 40 min more."]],"kefta-de-b-uf-taboule-et-yaourt":["Beef kofta, tabbouleh and yogurt",["Iron","Zinc","Vitamin C"],["Mix beef, chopped onion, cumin and half the parsley, shape into logs.","Cook the bulgur, mix with tomatoes, cucumber, herbs and lemon.","Grill the kofta for 8 min, turning.","Serve with the tabbouleh and yogurt."]],"salade-thai-de-b-uf":["Thai beef salad",["Iron","Vitamin C","Zinc"],["Cook the noodles, rinse in cold water.","Sear the beef 2 min per side, slice thinly.","Mix lime and soy sauce.","Assemble lettuce, vegetables, herbs, noodles and beef, drizzle with dressing."]],"boulettes-d-agneau-aux-epices-semoule-et-legumes":["Spiced lamb meatballs, couscous and vegetables",["Iron","Zinc","Vitamin B12"],["Mix the lamb with half the spices, shape into meatballs.","Brown them, add diced vegetables, chickpeas, remaining spices and 200 ml water.","Simmer 20 min.","Serve on the couscous with mint yogurt."]],"burger-maison-complet-et-crudites":["Homemade burger with slaw",["Iron","Zinc","Fibre"],["Shape 2 patties, pan-fry 3 to 4 min per side.","Grate carrot and cabbage, dress with yogurt and mustard.","Build the burgers with Comté, tomato, onion and lettuce.","Serve with the slaw."]],"filet-mignon-a-la-moutarde-haricots-verts-et-pommes-de-terre":["Pork tenderloin in mustard sauce, green beans and potatoes",["Vitamin B1","Protein","Potassium"],["Boil the potatoes for 20 min and the beans for 8 min.","Brown the tenderloin medallions 3 min per side.","Add the shallot, mustard and cream, simmer 3 min.","Serve with the vegetables."]],"porc-saute-au-gingembre-pak-choi-et-riz":["Ginger pork stir-fry with pak choi and rice",["Vitamin B1","Vitamin C","Calcium"],["Cook the rice.","Sear the pork strips for 4 min.","Add garlic, ginger and pak choi for 3 min.","Add soy sauce and honey, serve over rice."]],"filet-mignon-roti-pommes-et-chou-rouge":["Roast pork tenderloin with apples and red cabbage",["Vitamin B1","Vitamin C","Fibre"],["Sauté the onion, add shredded cabbage, diced apples, vinegar and cinnamon, cover and cook 35 min.","Brown the tenderloin on all sides.","Finish in the oven for 20 min at 180 °C.","Slice and serve on the cabbage."]],"bowl-facon-banh-mi-au-porc-marine":["Bánh mì-style marinated pork bowl",["Vitamin B1","Vitamin C","Fibre"],["Marinate the sliced pork in soy sauce and honey for 10 min.","Quick-pickle grated carrot and sliced radishes in vinegar with a pinch of salt.","Cook the rice, pan-fry the pork for 5 min.","Assemble with cucumber, pickles and coriander."]],"emince-de-porc-aux-poivrons-et-paprika-quinoa":["Paprika pork with peppers and quinoa",["Vitamin C","Vitamin B1","Magnesium"],["Cook the quinoa.","Sear the sliced pork with the paprika.","Add onion and peppers for 6 min, then tomatoes for 8 min.","Serve over the quinoa."]],"porc-aux-champignons-epinards-et-sarrasin":["Pork with mushrooms, spinach and buckwheat",["Vitamin B1","Iron","Magnesium"],["Boil the buckwheat for 12 min.","Brown the diced pork, set aside.","Sauté shallot and mushrooms, add the spinach.","Return the pork with the mustard, serve over the buckwheat."]],"shakshuka-aux-poivrons":["Pepper shakshuka",["Vitamin C","Lycopene","Protein"],["Sauté onion, garlic and pepper strips for 6 min.","Add spices and tomatoes, simmer 10 min.","Make 4 wells, crack in the eggs, cover and cook 6 min.","Sprinkle with feta and parsley, serve with the bread."]],"omelette-epinards-champignons-et-chevre":["Spinach, mushroom and goat's cheese omelette",["Protein","Iron","Vitamin B12"],["Sauté the sliced mushrooms, add the spinach for 1 min.","Pour in the beaten eggs, cook over low heat.","Add the goat's cheese, fold the omelette.","Serve with salad and bread."]],"frittata-de-legumes-et-salade":["Vegetable frittata with salad",["Protein","Vitamin C","Vitamin A"],["Pan-cook the diced potato for 10 min with onion, courgette and pepper.","Pour in the eggs beaten with the Parmesan.","Cook 5 min over low heat, then 8 min in the oven at 180 °C.","Serve in wedges with the salad."]],"bowl-uf-mollet-quinoa-avocat-et-kale":["Soft-boiled egg, quinoa, avocado and kale bowl",["Protein","Healthy fats","Vitamin K"],["Cook the quinoa.","Boil the eggs for 6 min, peel them.","Massage the shredded kale with lemon and oil.","Assemble, sprinkle with seeds."]],"ufs-cocotte-aux-epinards-et-pain-complet":["Baked eggs with spinach and wholemeal bread",["Protein","Iron","Calcium"],["Wilt the spinach for 2 min, divide between 4 ramekins.","Crack an egg into each, add cream and Comté.","Bake in a water bath for 12 min at 180 °C.","Serve with toast soldiers and salad."]],"riz-saute-complet-aux-ufs-et-legumes":["Brown rice, egg and vegetable fried rice",["Protein","Vitamin A","Fibre"],["Use leftover cold rice or cook it ahead.","Stir-fry diced carrot, garlic and peas for 4 min.","Add the rice for 3 min, push aside and scramble the eggs.","Toss with soy sauce and spring onion."]],"tortilla-espagnole-aux-courgettes":["Spanish courgette tortilla",["Protein","Potassium","Vitamin C"],["Gently cook thinly sliced potatoes, onion and courgette in the oil for 20 min.","Mix with the beaten eggs.","Cook 8 min over low heat, flip using a plate, cook 4 min.","Serve warm with the salad."]],"ramen-maison-uf-mollet-et-legumes":["Homemade ramen with soft egg and vegetables",["Protein","Vitamin C","Iodine"],["Boil the eggs for 6 min 30, peel them.","Bring 1 L water to the boil with stock and ginger, add mushrooms and carrot for 5 min.","Add pak choi and noodles for 4 min, off the heat stir in the miso.","Serve with the halved egg and spring onion."]],"galette-complete-uf-epinards-et-champignons":["Buckwheat galette with egg, spinach and mushrooms",["Protein","Iron","Magnesium"],["Sauté the mushrooms, add the spinach.","Warm a galette, crack an egg in the centre, add Comté and vegetables.","Fold in the edges once the white has set.","Serve with the salad."]],"clafoutis-sale-brocoli-et-feta":["Savoury broccoli and feta clafoutis",["Protein","Vitamin C","Calcium"],["Steam the broccoli for 5 min.","Whisk eggs, flour and milk.","Arrange broccoli, tomatoes and feta in a dish, pour over the batter.","Bake 30 min at 180 °C, serve with the salad."]],"salade-de-pommes-de-terre-ufs-et-haricots-verts":["Potato, egg and green bean salad",["Protein","Potassium","Vitamin K"],["Boil the potatoes for 20 min and the beans for 8 min.","Boil the eggs for 9 min.","Make a dressing with mustard, vinegar, oil and shallot.","Toss everything warm with gherkins and chives."]],"toast-avocat-ufs-brouilles-et-tomates":["Avocado toast with scrambled eggs and tomatoes",["Healthy fats","Protein","Vitamin E"],["Toast the bread.","Mash the avocado with lemon and salt.","Scramble the eggs over low heat.","Top the toasts with avocado, eggs, tomatoes, rocket and chilli."]],"tofu-saute-soja-gingembre-brocoli-et-riz":["Soy-ginger tofu with broccoli and rice",["Plant protein","Calcium","Vitamin C"],["Cook the rice.","Cube the tofu, coat in cornflour and brown for 8 min.","Stir-fry the broccoli with garlic and ginger for 4 min.","Add tofu and soy sauce, serve over rice."]],"curry-rouge-de-tofu-et-legumes":["Red Thai tofu and vegetable curry",["Calcium","Vitamin C const httpError=(path,status)=>Object.assign(new Error(path+" "+status),{status});
function isObj(o){return !!o&&typeof o==="object"&&!Array.isArray(o)}
function mergeDiff(a,b){
  if(!isObj(a)||!isObj(b))return JSON.stringify(a)===JSON.stringify(b)?undefined:b;
  const p={};let n=0;
  for(const k of Object.keys(a))if(!(k in b)){p[k]=null;n++}
  for(const k of Object.keys(b)){const d=mergeDiff(a[k],b[k]);if(d!==undefined){p[k]=d;n++}}
  return n?p:undefined;
}

const Store={
  db:null,uid:null,mode:"local",q:Promise.resolve(),synced:{},
  async init(){
    if(!window.claude||!window.claude.use){this.mode="api";return}
    try{const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(d&&u){const id=await u.id();if(id){this.db=d;this.uid=id;this.mode="db"}}}catch(e){console.warn(e)}
  },
  p(n){return "data/users/"+this.uid+"/"+n},
  async api(path,opt){const r=await fetch(path,opt);if(r.status===401)showAuth(S.invite?"signup":"login");if(!r.ok)throw httpError(path,r.status);return r.status===204?null:r.json()},
  run(fn){this.q=this.q.then(fn).catch(e=>{console.error(e);toast(tx("saveFail"))});return this.q},
  async getState(){
    if(this.mode==="db"){const s=await this.db.doc(this.p("state")).get();return s.exists?clone(s.data()):null}
    if(this.mode==="api")return this.api("/api/state");
    try{return JSON.parse(localStorage.getItem("assiette2:state")||"null")}catch(e){return null}
  },
  saveState(v){const d=clone(v);return this.run(async()=>{
    if(this.mode==="db")await this.db.doc(this.p("state")).set(d);
    else if(this.mode==="api"){const patch=mergeDiff(this.synced,d);if(!patch)return;const body=JSON.stringify(patch);
      await this.api("/api/state",{method:"PATCH",headers:{"Content-Type":"application/json"},body,keepalive:body.length<65536});this.synced=d}
    else{try{localStorage.setItem("assiette2:state",JSON.stringify(d))}catch(e){}}})},
  async listCustom(){
    if(this.mode==="db"){const qs=await this.db.collection(this.p("state/custom")).get();return qs.docs.map(d=>d.data()).filter(Boolean).map(clone)}
    if(this.mode==="api")return this.api("/api/custom");
    try{return JSON.parse(localStorage.getItem("assiette2:custom")||"[]")}catch(e){return []}
  },
  addCustom(list){const data=clone(list);return this.run(async()=>{
    if(this.mode==="db"){for(const r of data)await this.db.doc(this.p("state/custom/"+r.id)).set(r)}
    else if(this.mode==="api")await this.api("/api/custom",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    else{let cur=[];try{cur=JSON.parse(localStorage.getItem("assiette2:custom")||"[]")}catch(e){}try{localStorage.setItem("assiette2:custom",JSON.stringify(cur.concat(data)))}catch(e){}}})}
};

/* ---------- helpers ---------- */
let toastT;
function toast(m,undo){const t=$("#toast");t.innerHTML=esc(m)+(undo?` <button type="button" id="undo">${esc(tx("undo"))}</button>`:"");clearTimeout(toastT);
  if(undo)$("#undo").onclick=()=>{undo();t.innerHTML=""};toastT=setTimeout(()=>t.innerHTML="",undo?5000:2600)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtQty(q,u){
  q=Number(q)||0;if(q<=0)return "";
  const dec=LANG==="en"?".":",";
  const n=x=>(Math.round(x*2)/2).toString().replace(".",dec);
  const U=T().unit;
  if(u==="g"){if(q>=1000)return (Math.round(q/100)/10).toString().replace(".",dec)+" kg";return (q>=100?Math.round(q/10)*10:Math.max(1,Math.round(q)))+" g"}
  if(u==="ml"){if(q>=1000)return (Math.round(q/100)/10).toString().replace(".",dec)+" L";return Math.max(1,Math.round(q))+" ml"}
  if(u==="pièce")return n(Math.max(.5,q));
  if(u==="botte")return n(Math.max(.5,q))+" "+(q>1.25?U.botte[1]:U.botte[0]);
  return n(Math.max(.5,q))+" "+(U[u]||u);
}
const scale=(r,p)=>p/(r.base||2);
const isFav=id=>!!S.st.favs[id];
const inMine=id=>!!S.st.mine[id];
function excluded(r){
  const terms=String(S.st.prefs.exclusions||"").split(",").map(s=>slug(s.trim())).filter(Boolean);
  if(!terms.length)return false;
  const hay=r.ingredients.flatMap(i=>[slug(i.name),slug(EN.ing[i.name]||"")]).concat([slug(r.title),slug(r.en?r.en.title:"")]);
  return terms.some(t=>hay.some(h=>h&&h.includes(t)));
}
function eligible(r){if(S.st.dislikes[r.id]||excluded(r))return false;const d=S.st.done[r.id];return !(d&&Date.now()-d<DONE_COOLDOWN)}

/* ---------- decks ---------- */
function pickSpread(pool,n){
  const groups={};shuffle(pool).forEach(r=>(groups[r.protein]=groups[r.protein]||[]).push(r));
  const keys=shuffle(Object.keys(groups));const out=[];
  while(out.length<n&&keys.some(k=>groups[k].length))for(const k of keys){if(groups[k].length&&out.length<n)out.push(groups[k].shift())}
  return out;
}
function newDeck(){
  const pool=Object.values(CATALOG).filter(r=>!inMine(r.id)&&eligible(r)&&inTab(r,S.st.tab)&&inCat(r,S.st.cat));
  const local=pickSpread(pool.filter(isLocal),DECK-2);
  const rest=pickSpread(pool.filter(r=>!isLocal(r)),DECK-local.length);
  const out=local.slice();rest.forEach(r=>out.splice(Math.floor(Math.random()*(out.length+1)),0,r));
  S.st.decks[deckKey()]=out.map(r=>r.id);save();
}
function ensureDeck(){if(!(S.st.decks[deckKey()]||[]).some(id=>CATALOG[id]))newDeck()}

/* ---------- actions ---------- */
function addMine(id,persons){S.st.mine[id]={persons:persons||S.st.prefs.persons||2,addedAt:Date.now()};save();toast(tx("tAddedMine"));render()}
function removeMine(id){const prev=S.st.mine[id];delete S.st.mine[id];clampBought();save();toast(tx("tRemoved"),()=>{S.st.mine[id]=prev;save();render()});render()}
function markDone(id){
  const prev=S.st.mine[id];delete S.st.mine[id];S.st.done[id]=Date.now();clampBought();save();
  if(S.sheet&&S.sheet.id===id)S.sheet=null;
  toast(tx("tDone"),()=>{S.st.mine[id]=prev;delete S.st.done[id];save();render()});render();
}
function setPersons(id,d){const m=S.st.mine[id];if(!m)return;m.persons=Math.min(12,Math.max(1,m.persons+d));save();render()}
function toggleFav(id){if(S.st.favs[id]){delete S.st.favs[id];toast(tx("tFavOff"))}else{S.st.favs[id]=Date.now();toast(tx("tFavOn"))}save();render()}
function dislike(id){
  const r=CATALOG[id];if(!r||!confirm(tx("confirmNever",titleOf(r))))return;
  S.st.dislikes[id]=Date.now();delete S.st.favs[id];delete S.st.mine[id];clampBought();
  S.sheet=null;save();toast(tx("tNever"));render();
}
function removeExtra(id){
  const prev=S.st.extras[id];if(!prev)return;delete S.st.extras[id];save();
  toast(tx("tExtraRm"),()=>{S.st.extras[id]=prev;save();render()});render();
}
function undislike(id){delete S.st.dislikes[id];save();toast(tx("tReallow"));render()}

/* ---------- shopping ---------- */
function totals(){
  const map=new Map();
  for(const [id,m] of Object.entries(S.st.mine)){const r=CATALOG[id];if(!r)continue;const k=scale(r,m.persons);
    for(const i of r.ingredients){const key=slug(i.name)+"|"+i.unit;const cur=map.get(key)||{key,name:i.name,unit:i.unit,qty:0,rayon:rayonOf(i)};cur.qty+=(Number(i.qty)||0)*k;map.set(key,cur)}}
  return map;
}
function clampBought(){const t=totals();for(const k of Object.keys(S.st.bought)){const tot=t.get(k);if(!tot)delete S.st.bought[k];else S.st.bought[k]=Math.min(S.st.bought[k],tot.qty)}}
function shoppingGroups(){
  const t=totals();const todo={},done=[];const cmp=(a,b)=>ingName(a.name).localeCompare(ingName(b.name),LANG);
  for(const it of t.values()){const b=S.st.bought[it.key]||0;const rem=it.qty-b;
    if(rem>it.qty*0.001+1e-9)(todo[it.rayon]=todo[it.rayon]||[]).push({...it,rem,partial:b>0});else done.push(it)}
  for(const [id,x] of Object.entries(S.st.extras)){const it={key:"x:"+id,name:x.name,rayon:x.rayon,extra:true};if(x.done)done.push(it);else(todo[x.rayon]=todo[x.rayon]||[]).push(it)}
  return {groups:RAYONS.filter(r=>todo[r]).map(r=>({rayon:r,items:todo[r].sort(cmp)})),done:done.sort(cmp),count:t.size+Object.keys(S.st.extras).length};
}

let sampleFn;
async function getSample(){if(sampleFn!==undefined)return sampleFn;if(!window.claude||!window.claude.use)return sampleFn=null;try{sampleFn=await window.claude.use("sample")}catch(e){sampleFn=null}return sampleFn}
function errMsg(e){return ({not_granted:tx("eNotGranted"),rate_limited:tx("eRate"),invalid_json:tx("eJson"),cancelled:tx("eCancel")})[e&&e.code]||tx("eGen")}
async function generateRecipes(){
  if(S.gen)return;
  const sample=await getSample();
  if(!sample){S.genErr=tx("eOnly");render();return}
  S.gen=true;S.genErr="";S.genMsg=tx("aiMsg");render();
  const tab=S.st.tab,cat=S.st.cat,key=deckKey();
  const month=I18N.fr.months[MONTH-1];
  const tabTxt=tab==="quick"?" Toutes se préparent en 20 minutes maximum, préparation et cuisson comprises.":tab==="batch"?" Toutes se cuisinent en grande quantité le week-end et se gardent 3 à 4 jours au réfrigérateur sans perdre en qualité.":tab==="dinner"?" Ce sont des dîners de plus de 20 minutes, un peu plus élaborés.":"";
  const catTxt=cat==="all"?"":` La protéine principale de chaque recette est une de : ${Object.keys(PROT).filter(p=>PROT[p]===cat).join(", ")}.`;
  const titles=Object.values(CATALOG).map(r=>r.title);
  const prompt=`Tu es nutritionniste et cuisinier. Écris 6 nouvelles recettes saines, complètes et savoureuses pour une cuisine maison en France. Au moins 5 sont des recettes françaises ou européennes du quotidien, avec uniquement des légumes et fruits de saison en France en ${month}. Une seule peut être un écart (cuisine du monde).${tabTxt}${catTxt}
Règles : beaucoup de légumes, une source de protéines, un féculent complet ou des légumineuses, une bonne matière grasse. Varie les protéines. Pas de charcuterie ni de produits ultra-transformés.
Exclusions (jamais) : ${S.st.prefs.exclusions||"aucune"}
Envies : ${S.st.prefs.envies||"aucune précision"}
Titres déjà au catalogue, à ne pas reproduire ni décliner de près : ${titles.join(" ; ")}
Pour les ingrédients, réutilise si possible exactement ces noms : ${Object.keys(RAY).join(", ")}
Réponds uniquement par un tableau JSON de 6 objets au format :
{"title":"Nom court","cuisine":"locale","batch":false,"meal":"midi","protein":"poisson","minutes":30,"kcal":550,"proteines":32,"fibres":10,"highlights":["Oméga-3","Fer"],"ingredients":[{"name":"courgette","name_en":"courgette","qty":300,"unit":"g","rayon":"Fruits & légumes"}],"steps":["Étape concise"],"en":{"title":"Short name","highlights":["Omega-3","Iron"],"steps":["Concise step"]}}
- quantités pour 2 personnes ; kcal, proteines (g), fibres (g) estimés par portion
- batch vaut true si le plat se garde 3 à 4 jours au frais ; cuisine vaut locale ou monde ; meal vaut midi, soir ou both ; protein vaut une de : ${Object.keys(PROT).join(", ")}
- unit vaut une de : ${UNITS.join(", ")} ; rayon vaut une de : ${RAYONS.join(", ")}
- highlights : 2 ou 3 atouts nutritionnels ; 3 à 5 étapes
- "en" et "name_en" : traduction anglaise (anglais britannique), mêmes étapes dans le même ordre`;
  try{
    const res=await sample.json(prompt,{cache:false});
    if(!Array.isArray(res))throw {code:"invalid_json"};
    const added=[];
    for(const d of res){
      if(!d||!d.title||!Array.isArray(d.ingredients)||!Array.isArray(d.steps))continue;
      const id="c-"+slug(d.title);if(id==="c-"||CATALOG[id])continue;
      const ings=d.ingredients.filter(i=>i&&i.name).map(i=>{const name=String(i.name).toLowerCase();return {name,name_en:i.name_en?String(i.name_en):null,qty:Number(i.qty)||0,unit:UNITS.includes(i.unit)?i.unit:"pièce",rayon:RAY[name]||(RAYONS.includes(i.rayon)?i.rayon:"Épicerie")}});
      const e=d.en&&typeof d.en==="object"&&d.en.title?{title:String(d.en.title),highlights:(Array.isArray(d.en.highlights)?d.en.highlights:[]).map(String).slice(0,3),steps:(Array.isArray(d.en.steps)?d.en.steps:[]).map(String).slice(0,6)}:null;
      const r={id,title:String(d.title),meal:["midi","soir","both"].includes(d.meal)?d.meal:"both",protein:PROT[d.protein]?d.protein:"légumineuses",
        minutes:Number(d.minutes)||30,kcal:Number(d.kcal)||null,proteines:Number(d.proteines)||null,fibres:Number(d.fibres)||null,
        highlights:(Array.isArray(d.highlights)?d.highlights:[]).map(String).slice(0,3),ingredients:ings,steps:d.steps.map(String).slice(0,6),
        base:2,custom:true,addedAt:Date.now(),batch:d.batch===true,en:e};
      r.world=d.cuisine==="monde"||ings.some(i=>WORLD.has(i.name));
      added.push(r);
    }
    if(!added.length)throw {code:"invalid_json"};
    added.forEach(registerCustom);
    await Store.addCustom(added);
    S.st.decks[key]=added.filter(r=>!excluded(r)&&inTab(r,tab)&&inCat(r,cat)).map(r=>r.id).concat(S.st.decks[key]||[]).slice(0,DECK+6);save();
    S.query="";window.scrollTo(0,0);
    toast(tx("aiAdded",added.length));
  }catch(e){console.error(e);S.genErr=errMsg(e)}
  finally{S.gen=false;S.genMsg="";render()}
}
function registerCustom(r){
  r.ingredients.forEach(i=>{if(i.name_en&&!EN.ing[i.name])EN.ing[i.name]=i.name_en});
  addRecipe(r);
}

  const x=[];if(r.world)x.push(tx("tWorld"));if(!inSeason(r))x.push(tx("tOff"));
  if(!t.length&&!x.length)return "";

}

function resultsHTML(){
  const q=slug(S.query);let h="";
  if(q){
    const res=Object.values(CATALOG).filter(r=>!S.st.dislikes[r.id]&&!excluded(r)&&inTab(r,S.st.tab)&&inCat(r,S.st.cat)&&(slug(r.title).includes(q)||(r.en&&slug(r.en.title).includes(q))||r.ingredients.some(i=>slug(i.name).includes(q)||slug(EN.ing[i.name]||"").includes(q))));
    if(!res.length)return `<p class="muted">${esc(tx("noMatch"))}</p>`;
    return `<p class="muted small">${esc(tx("results",res.length))}</p>`+res.slice(0,40).map(r=>cardHTML(r,"discover")).join("");
  }
  const deck=(S.st.decks[deckKey()]||[]).map(id=>CATALOG[id]).filter(r=>r&&!S.st.dislikes[r.id]&&!excluded(r));
  if(!deck.length)h+=`<div class="empty"><p class="muted">${esc(tx("emptyDeck"))}</p></div>`;
  else h+=deck.map(r=>cardHTML(r,"discover")).join("");
  h+=`<div class="more"><button class="btn ghost" data-act="reshuffle">${esc(tx("other"))}</button></div>`;
  if(S.genMsg)h+=`<div class="status">${esc(S.genMsg)}</div>`;

  return h;
}

async function submitAuth(form){
  const f=new FormData(form);const email=String(f.get("email")||"").trim(),password=String(f.get("password")||"");
  S.authErr="";
  const signup=S.auth==="signup";
  try{
    const path=signup?"/signup":"/login";
    const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(signup?{token:S.invite,email,password}:{email,password})});
    if(!r.ok)throw httpError(path,r.status);
    if(signup)S.invite=null;
  }catch(e){console.error(e);S.authErr=authErrText(e);showAuth(S.auth);return}
  S.auth=null;$("#app").innerHTML=`<p class="muted">Chargement…</p>`;boot();
}

    <h3>${esc(tx("ings"))} <span class="stepper" role="group" aria-label="${esc(tx("persGroup"))}"><button data-act="sminus" aria-label="${esc(tx("lessP"))}">−</button><span>${esc(tx("pers",persons))}</span><button data-act="splus" aria-label="${esc(tx("moreP"))}">+</button></span></h3>
    <ul class="ings">${r.ingredients.map(i=>`<li><span>${esc(ingName(i.name))}</span><span>${esc(fmtQty(i.qty*k,i.unit))}</span></li>`).join("")}</ul>
    <h3>${esc(tx("prep"))}</h3><ol class="steps">${(L.steps&&L.steps.length?L.steps:r.steps).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    <div class="actions">
      ${m?iconBtn("",tx("done"),icon("done"),`data-act="done" data-id="${esc(r.id)}"`)+iconBtn("ghost",tx("remove"),icon("remove"),`data-act="unmine" data-id="${esc(r.id)}"`):iconBtn("",tx("addMine"),icon("add"),`data-act="mine" data-id="${esc(r.id)}"`)}
      ${iconBtn(`ghost ${fav?"fav-on":""}`,tx("fav"),icon("fav",18,fav?"currentColor":"none"),`data-act="fav" data-id="${esc(r.id)}" aria-pressed="${fav}"`)}
      ${iconBtn("danger",tx("never"),icon("never"),`data-act="dislike" data-id="${esc(r.id)}"`)}
    </div>
  </div>`;
}
function render(){
  if(!S.loaded)return;
  document.documentElement.lang=LANG;
  const y=window.scrollY;
  $("#app").innerHTML={discover:discoverView,mine:mineView,shop:shopView,plus:plusView}[S.view]();
  const nMine=Object.keys(S.st.mine).length;const nav=tx("nav");
  $("#tabs").innerHTML=[["discover"],["mine",nMine],["shop"],["plus"]].map(([k,n])=>`<button data-view="${k}" ${S.view===k?'aria-current="page"':""} aria-label="${esc(nav[k]+(n?" ("+n+")":""))}" title="${esc(nav[k])}">${icon(k,22)}${n?`<b>${n}</b>`:""}</button>`).join("");
  $("nav.tabs").setAttribute("aria-label",LANG==="en"?"Sections":"Sections");
  const had=!!$("#sheet-root").innerHTML;
  $("#sheet-root").innerHTML=sheetHTML();
  document.body.style.overflow=S.sheet?"hidden":"";
  if(S.sheet&&!had){const b=$(".sheet .close button");b&&b.focus()}
  window.scrollTo(0,y);
}
function safe(fn){try{fn()}catch(e){console.error(e);toast((LANG==="en"?"Something went wrong: ":"Erreur : ")+(e&&e.message||e))}}

/* ---------- events ---------- */
document.addEventListener("click",e=>safe(()=>{
  const t=e.target.closest("[data-view],[data-open],[data-act],[data-tab],[data-cat],[data-lang]");if(!t)return;
  if(t.dataset.view){S.view=t.dataset.view;S.sheet=null;render();window.scrollTo(0,0);return}
  if(t.dataset.tab){S.st.tab=t.dataset.tab;ensureDeck();save();render();return}
  if(t.dataset.cat){S.st.cat=t.dataset.cat;ensureDeck();save();render();return}
  if(t.dataset.lang){LANG=t.dataset.lang;if(Store.mode==="api")saveLang();else{S.st.lang=LANG;save()}render();return}
  if(t.dataset.open){S.sheet={id:t.dataset.open};S.sheetPersons=null;render();return}
  const a=t.dataset.act,id=t.dataset.id||(S.sheet&&S.sheet.id);
  switch(a){
    case "close":S.sheet=null;render();break;
    case "mine":addMine(id,S.sheet&&S.sheet.id===id?S.sheetPersons:null);break;
    case "unmine":removeMine(id);break;
    case "done":markDone(id);break;
    case "plus":setPersons(id,1);break;
    case "minus":setPersons(id,-1);break;
    case "splus":case "sminus":{const d=a==="splus"?1:-1;if(S.st.mine[id])setPersons(id,d);else{S.sheetPersons=Math.min(12,Math.max(1,(S.sheetPersons||S.st.prefs.persons||2)+d));render()}break}
    case "fav":toggleFav(id);break;
    case "dislike":dislike(id);break;
    case "undislike":undislike(id);break;
    case "reshuffle":newDeck();render();window.scrollTo(0,0);break;
    case "generate":generateRecipes();break;
    case "copy":copyList();break;
    case "rmextra":removeExtra(id);break;
    case "invite":createInvite();break;
    case "refresh":reload(true);break;
    case "logout":logout();break;
    case "authmode":S.authErr="";showAuth(S.auth==="signup"?"login":"signup");break;
  }
}));
document.addEventListener("change",e=>safe(()=>{
  const b=e.target.closest("[data-buy],[data-unbuy]");if(!b)return;
  const key=b.dataset.buy||b.dataset.unbuy;
  if(key.startsWith("x:")){const x=S.st.extras[key.slice(2)];if(!x)return;x.done=!!b.dataset.buy}
  else{const t=totals().get(key);if(!t)return;if(b.dataset.buy)S.st.bought[key]=t.qty;else delete S.st.bought[key]}
  save();setTimeout(render,b.dataset.buy?250:0);
}));
document.addEventListener("input",e=>{if(e.target.matches("[data-search]")){S.query=e.target.value;$("#results").innerHTML=resultsHTML()}});
document.addEventListener("submit",e=>safe(()=>{
  if(e.target.matches("[data-form=auth]")){e.preventDefault();submitAuth(e.target);return}
  if(e.target.matches("[data-form=extra]")){e.preventDefault();
    const f=new FormData(e.target);const name=String(f.get("name")||"").trim();if(!name)return;
    const rayon=RAYONS.includes(f.get("rayon"))?f.get("rayon"):"Épicerie";
    S.st.extras[Date.now().toString(36)+Math.random().toString(36).slice(2,6)]={name,rayon,done:false};
    save();render();const i=$("form.extra input");i&&i.focus();return}
  if(!e.target.matches("[data-form=prefs]"))return;e.preventDefault();
  const f=new FormData(e.target);
  S.st.prefs={persons:Math.min(12,Math.max(1,parseInt(f.get("persons"))||2)),exclusions:String(f.get("exclusions")||""),envies:String(f.get("envies")||"")};
  save(true);toast(tx("settingsSaved"));
}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render()}});
async function copyList(){
  const {groups}=shoppingGroups();
  const txt=groups.map(g=>rayonName(g.rayon)+"\n"+g.items.map(it=>"- "+ingName(it.name)+(fmtQty(it.rem,it.unit)?" : "+fmtQty(it.rem,it.unit):"")).join("\n")).join("\n\n");
  try{await navigator.clipboard.writeText(txt);toast(tx("copied"))}
  catch(err){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();toast(ok?tx("copied"):tx("copyFail"))}
}

/* ---------- boot ---------- */
function applyState(st){
  Store.synced=clone(st||{});
  if(st){const base=clone(DEFAULT);S.st={...base,...st,prefs:{...base.prefs,...(st.prefs||{})}};
    for(const k of ["decks","mine","done","favs","dislikes","bought"])if(!S.st[k]||typeof S.st[k]!=="object"||Array.isArray(S.st[k]))S.st[k]={};
    if(Array.isArray(S.st.extras))S.st.extras=Object.fromEntries(S.st.extras.filter(x=>x&&x.id).map(({id,...x})=>[id,x]));
    else if(!isObj(S.st.extras))S.st.extras={};
    if(Array.isArray(st.deck)){if(!S.st.decks.all)S.st.decks.all=st.deck;delete S.st.deck}}
  if(!TAB_KEYS.includes(S.st.tab))S.st.tab="all";
  if(!CAT_KEYS.includes(S.st.cat))S.st.cat="all";
  if(Store.mode==="api")delete S.st.lang;
  LANG=(Store.mode==="api"?S.lang:S.st.lang)==="en"?"en":"fr";
}
document.addEventListener("visibilitychange",async()=>{
  if(Store.mode!=="api"||!S.loaded)return;
  if(document.hidden){if(saveT)save(true);return}
  autoRefresh();
});
const AUTO_REFRESH_MS=10000;
let lastLoad=0;
function autoRefresh(){if(Store.mode==="api"&&S.loaded&&!saveT&&Date.now()-lastLoad>=AUTO_REFRESH_MS)reload(false)}
document.addEventListener("click",autoRefresh);
document.addEventListener("keydown",autoRefresh);
const isEditing=()=>!!document.activeElement&&document.activeElement.matches("input:not([type=checkbox]),textarea,select");
async function loadRemote(){
  const api=Store.mode==="api";
  lastLoad=Date.now();
  const [st,custom,team,me]=await Promise.all([Store.getState(),Store.listCustom(),api?Store.api("/api/team"):null,api?Store.api("/api/me"):null]);
  (custom||[]).forEach(r=>{if(r&&r.id&&Array.isArray(r.ingredients))registerCustom(r)});
  if(team)S.team=team.members||[];
  if(me)S.lang=me.lang;
  return st;
}
async function reload(manual){
  if(S.refreshing)return;
  S.refreshing=true;if(manual)render();
  try{
    if(saveT)save(true);
    await Store.q;
    const e0=edits;
    const st=await loadRemote();
    if(saveT||edits!==e0)return;
    applyState(st);ensureDeck();
    if(manual)toast(tx("refreshed"));
  }catch(e){console.error(e);if(manual&&!S.auth)toast(tx("loadFail"))}
  finally{S.refreshing=false;if(manual||!isEditing())render()}
}
async function boot(){
  await Store.init();
  if(Store.mode==="api"){
    const m=location.hash.match(/invite=([\w-]+)/);
    if(m){S.invite=m[1];history.replaceState(null,"",location.pathname+location.search)}
    try{await Store.api("/api/me")}catch(e){if(S.auth)return;console.error(e)}
    if(S.invite){const inv=S.invite;S.invite=null;
      if(confirm(tx("confirmJoin")))try{await Store.api("/api/invites/"+encodeURIComponent(inv)+"/join",{method:"POST"});toast(tx("joined"))}
      catch(e){console.error(e);if(S.auth)return;toast(tx(e.status===410?"inviteGone":"joinFail"))}}
  }
  let st=null;
  try{
    st=await loadRemote();
  }catch(e){console.error(e);if(S.auth)return;toast(tx("loadFail"))}
  applyState(st);
  S.loaded=true;ensureDeck();render();
}
boot();
})();
</script>
</body>
</html>
